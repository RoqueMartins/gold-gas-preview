<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gold Gas GNV | Preview da Landing Page</title>
  <meta name="description" content="Preview visual da landing page Gold Gas GNV." />
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #001A45;
      font-family: Arial, Helvetica, sans-serif;
    }

    .topbar {
      position: fixed;
      z-index: 10;
      right: 18px;
      bottom: 18px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 13px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .25);
      background: rgba(0, 26, 69, .82);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 40px rgba(0, 0, 0, .25);
    }

    .pill.whatsapp {
      background: #FFB800;
      color: #001A45;
      border-color: #FFB800;
    }

    .stage {
      width: min(100%, 1180px);
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 0 80px rgba(0,0,0,.32);
    }

    .mockup {
      display: block;
      width: 100%;
      height: auto;
    }

    .notice {
      position: fixed;
      z-index: 9;
      left: 18px;
      bottom: 18px;
      max-width: 320px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(0, 26, 69, .84);
      color: rgba(255,255,255,.86);
      font-size: 12px;
      line-height: 1.45;
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 40px rgba(0,0,0,.22);
    }

    .notice strong {
      display: block;
      color: #FFB800;
      margin-bottom: 4px;
      font-size: 13px;
    }

    @media (max-width: 720px) {
      .stage {
        width: 100%;
      }

      .notice {
        display: none;
      }

      .topbar {
        left: 12px;
        right: 12px;
        bottom: 12px;
      }

      .pill {
        flex: 1;
        padding: 12px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <img class="mockup" src="./gold-gas-landing-mockup.png" alt="Preview visual da landing page Gold Gas GNV" />
  </main>

  <div class="notice">
    <strong>Preview visual</strong>
    Esta versão foi feita para apresentação ao cliente. Depois da aprovação, o layout pode virar site navegável em HTML/WordPress/Webflow.
  </div>

  <div class="topbar">
    <a class="pill" href="./gold-gas-landing-mockup.png" target="_blank" rel="noopener">Abrir imagem</a>
    <a class="pill whatsapp" href="https://wa.me/5521964373146" target="_blank" rel="noopener">💬 WhatsApp</a>
  </div>
</body>
</html>
